name: Publish to NPM

on:
  push:
    branches:
      - main
    paths-ignore:
      - "examples/**"
      - ".github/workflows/deploy-demo.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # Nothing reaches npm that has not been linted, type-checked, unit-tested
      # and smoke-tested as a built tarball against a real React consumer.
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm test:run
      - run: node scripts/smoke-dist.mjs 18
      - run: node scripts/smoke-dist.mjs 19

      - run: pnpm build

      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
