name: Publish to NPM

on:
  push:
    branches:
      - main
    paths-ignore:
      - "examples/**"
      - ".github/workflows/deploy-demo.yml"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Ensure an npm that can authenticate via OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      # `npm run release:rc` commits and tags on the current branch. If that
      # branch is main, this workflow fires for a prerelease version - which
      # must never be published under the `latest` tag. Release candidates are
      # published by release-rc.yml, off the tag.
      # Most pushes to main are merged pull requests that do not change the
      # version. Publishing is driven by the version in package.json: it happens
      # only when `npm run release` has bumped it to something not yet on npm.
      - name: Decide whether there is anything to publish
        id: gate
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-*)
              echo "stable=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$VERSION is a prerelease - release-rc.yml owns it, nothing to do here."
              exit 0
              ;;
          esac
          if npm view "wizzard-stepper-react@$VERSION" version >/dev/null 2>&1; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on npm - nothing to publish."
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "publishing $VERSION"
          fi

      # Nothing reaches npm that has not been linted, type-checked, unit-tested
      # and smoke-tested as a built tarball against a real React consumer.
      - run: pnpm lint
        if: steps.gate.outputs.stable == 'true'
      - run: npx tsc --noEmit
        if: steps.gate.outputs.stable == 'true'
      - run: pnpm test:run
        if: steps.gate.outputs.stable == 'true'
      - run: node scripts/smoke-dist.mjs 18
        if: steps.gate.outputs.stable == 'true'
      - run: node scripts/smoke-dist.mjs 19
        if: steps.gate.outputs.stable == 'true'

      - run: pnpm build
        if: steps.gate.outputs.stable == 'true'

      # npm publish, not pnpm publish: OIDC trusted publishing is only wired
      # into the npm CLI. No token - the id-token permission above is the
      # credential, and npm attaches provenance automatically.
      - run: npm publish
        if: steps.gate.outputs.stable == 'true'
