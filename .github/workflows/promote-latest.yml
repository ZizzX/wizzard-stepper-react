name: Promote to latest

# Moves the `latest` dist-tag onto a version that is already on npm. This does
# not build or publish anything - it only decides which version a plain
# `npm install` resolves to. Run it once a release candidate has been verified.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already published to npm (e.g. 3.0.0-rc.0)"
        required: true
        type: string

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify the version exists on npm
        run: |
          VERSION="${{ inputs.version }}"
          if ! npm view "wizzard-stepper-react@$VERSION" version >/dev/null 2>&1; then
            echo "::error::wizzard-stepper-react@$VERSION is not published"
            exit 1
          fi
          echo "found wizzard-stepper-react@$VERSION"

      - name: Move the latest tag
        run: npm dist-tag add "wizzard-stepper-react@${{ inputs.version }}" latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### \`latest\` now points at ${{ inputs.version }}"
            echo ""
            npm dist-tag ls wizzard-stepper-react
          } >> "$GITHUB_STEP_SUMMARY"
